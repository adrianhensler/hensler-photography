<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>{% block page_title %}{{ title }} - Hensler Photography{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/variables.css">
    <link rel="stylesheet" href="/static/css/admin-common.css">
    <link rel="stylesheet" href="/static/css/manage-shell.css">
    <script>
        // Before first paint: saved choice, else follow the OS (design.html spec).
        (function() {
            let theme = null;
            try { theme = localStorage.getItem('theme'); } catch (e) { /* storage blocked */ }
            if (theme !== 'dark' && theme !== 'light') {
                theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    {% block head_scripts %}{% endblock %}
    {% block styles %}{% endblock %}
</head>
<body>
    {% include 'photographer/_header.html' %}
    <main class="manage-main">
        {% block content %}{% endblock %}
    </main>
    <script src="/static/js/manage-header.js" defer></script>
    {% block scripts %}{% endblock %}
</body>
</html>
