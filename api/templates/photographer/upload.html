{% extends 'photographer/base.html' %}
{% block styles %}
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif);
            background: var(--bg-secondary);
            color: var(--text-primary);
            transition: background-color 0.3s ease, color 0.3s ease;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        /* Drop zone: full size until previews exist, then a slim bar */
        .upload-area {
            background: var(--bg-primary);
            border: 2px dashed var(--border-medium);
            border-radius: 12px;
            padding: 3rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease, padding 0.3s ease;
            margin-bottom: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .upload-area.dragover {
            border-color: var(--accent);
            background: var(--hover-bg);
        }

        .upload-area:hover {
            border-color: var(--accent);
        }

        .upload-icon {
            width: 2.5rem;
            height: 2.5rem;
            color: var(--text-tertiary);
        }

        .upload-icon svg {
            width: 100%;
            height: 100%;
        }

        .upload-area h2 {
            font-size: 1.25rem;
            font-weight: 500;
        }

        .upload-area p {
            color: var(--text-tertiary);
            font-size: 0.9rem;
        }

        .upload-area .btn {
            margin-top: 0.5rem;
        }

        /* Collapsed state: once at least one preview exists */
        .upload-area.is-compact {
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem 1.5rem;
            text-align: left;
        }

        .upload-area.is-compact .upload-icon {
            width: 1.5rem;
            height: 1.5rem;
            flex-shrink: 0;
        }

        .upload-area.is-compact h2 {
            font-size: 0.95rem;
        }

        .upload-area.is-compact p {
            font-size: 0.8rem;
        }

        .upload-area.is-compact .btn {
            margin-top: 0;
        }

        #fileInput {
            display: none;
        }

        /* Preview rows: full-width contact-sheet style */
        .previews {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .preview-card {
            position: relative;
            background: var(--bg-primary);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: grid;
            grid-template-columns: auto 320px 1fr;
            gap: 1.25rem;
            padding: 1.25rem;
            align-items: start;
        }

        .preview-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--accent);
            margin-top: 0.15rem;
        }

        .preview-image-col {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .preview-image {
            width: 100%;
            height: auto;
            max-height: 260px;
            object-fit: contain;
            background: var(--bg-secondary);
            border-radius: 8px;
        }

        .preview-filename {
            font-weight: 500;
            font-size: 0.85rem;
            word-break: break-all;
        }

        .preview-size {
            color: var(--text-tertiary);
            font-size: 0.8rem;
        }

        .preview-status {
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            display: inline-block;
            align-self: flex-start;
        }

        .status-pending {
            background: var(--bg-tertiary);
            /* text-primary, not -secondary: small text on bg-tertiary needs it for AA */
            color: var(--text-primary);
        }

        .status-processing {
            background: var(--warning-bg);
            color: var(--warning-text);
        }

        .status-success {
            background: var(--success-bg);
            color: var(--success-text);
        }

        .status-error {
            background: var(--error-bg);
            color: var(--error-text);
        }

        .preview-content {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            min-width: 0;
        }

        /* Once a row finishes successfully, hide the progress bar/stage text
           and keep only the status pill. Errors keep everything visible. */
        .preview-card.is-done .progress-bar,
        .preview-card.is-done .progress-stage {
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: var(--border-light);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s ease, background 0.3s ease;
        }

        .progress-fill.uploading {
            background: var(--accent);
        }

        .progress-fill.processing {
            background: var(--warning);
        }

        .progress-fill.complete {
            background: var(--success);
        }

        .progress-stage {
            font-size: 0.75rem;
            color: var(--text-tertiary);
            font-style: italic;
        }

        .field-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-tertiary);
            font-weight: 600;
            display: block;
            margin-bottom: 0.25rem;
        }

        .ai-metadata {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .field-row {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .field-row > div {
            flex: 1 1 200px;
            min-width: 0;
        }

        .ai-metadata input,
        .ai-metadata textarea,
        .tech-grid input {
            width: 100%;
            padding: 0.5rem 0.6rem;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-light);
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.9rem;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .ai-metadata input:focus,
        .ai-metadata textarea:focus,
        .tech-grid input:focus {
            outline: none;
            background: var(--bg-primary);
            border-color: var(--accent);
        }

        .ai-metadata textarea {
            resize: vertical;
            min-height: 4.5rem;
            line-height: 1.5;
        }

        /* Camera details: collapsed by default */
        .camera-details {
            border-top: 1px solid var(--border-light);
            padding-top: 0.5rem;
        }

        .camera-details summary {
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-secondary);
            list-style: none;
            padding: 0.25rem 0;
        }

        .camera-details summary::-webkit-details-marker {
            display: none;
        }

        .camera-details summary::before {
            content: '▸';
            display: inline-block;
            margin-right: 0.4rem;
            transition: transform 0.15s ease;
        }

        .camera-details[open] summary::before {
            transform: rotate(90deg);
        }

        .camera-details summary:focus-visible {
            outline: 2px solid var(--focus-border);
            outline-offset: 2px;
        }

        .camera-details-body {
            padding-top: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .tech-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 0.75rem;
        }

        .tech-field label {
            font-size: 0.75rem;
            color: var(--text-tertiary);
            display: block;
            margin-bottom: 0.25rem;
        }

        .specs-line {
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem 0.9rem;
        }

        .specs-line strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        .print-sizes {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .print-size {
            padding: 0.2rem 0.5rem;
            background: var(--bg-tertiary);
            /* text-primary, not -secondary: small text on bg-tertiary needs it for AA */
            color: var(--text-primary);
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 500;
        }

        .meta-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.25rem;
            padding-top: 0.75rem;
            border-top: 1px solid var(--border-light);
        }

        .actions .actions-left {
            display: flex;
            gap: 0.5rem;
        }

        .actions .actions-right {
            display: flex;
            gap: 0.5rem;
            margin-left: auto;
        }

        .batch-controls {
            background: var(--bg-primary);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            display: none;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .batch-controls.visible {
            display: flex;
        }

        .batch-controls .batch-count {
            font-size: 0.9rem;
            font-weight: 500;
        }

        .batch-controls .btn-danger {
            margin-left: auto;
            margin-right: var(--space-md);
        }

        /* Toast Notification System */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 420px;
        }

        .toast {
            background: var(--bg-primary);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.15);
            display: flex;
            gap: 12px;
            align-items: flex-start;
            animation: slideIn 0.3s ease;
        }

        .toast.toast-error {
            border-left: 4px solid var(--error);
        }

        .toast.toast-warning {
            border-left: 4px solid var(--warning);
        }

        .toast.toast-success {
            border-left: 4px solid var(--success);
        }

        .toast.toast-info {
            border-left: 4px solid var(--accent);
        }

        .toast-icon {
            font-size: 24px;
            flex-shrink: 0;
        }

        .toast-error .toast-icon { color: var(--error); }
        .toast-warning .toast-icon { color: var(--warning); }
        .toast-success .toast-icon { color: var(--success); }
        .toast-info .toast-icon { color: var(--accent); }

        .toast-content {
            flex: 1;
            min-width: 0;
        }

        .toast-title {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 4px;
            color: var(--text-primary);
        }

        .toast-message {
            font-size: 0.85rem;
            color: var(--text-tertiary);
            line-height: 1.4;
        }

        .toast-details {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--border-light);
        }

        .toast-details-toggle {
            font-size: 0.8rem;
            color: var(--accent);
            cursor: pointer;
            user-select: none;
            background: none;
            border: none;
            font-family: inherit;
            padding: 0;
        }

        .toast-details-toggle:hover {
            text-decoration: underline;
        }

        .toast-details-content {
            margin-top: 8px;
            font-size: 0.75rem;
            font-family: var(--font-mono, 'SF Mono', Monaco, 'Courier New', monospace);
            background: var(--bg-secondary);
            padding: 8px;
            border-radius: 4px;
            max-height: 200px;
            overflow-y: auto;
            color: var(--text-primary);
        }

        .toast-close {
            color: var(--text-tertiary);
            cursor: pointer;
            font-size: 20px;
            line-height: 1;
            padding: 4px;
            flex-shrink: 0;
            background: none;
            border: none;
            font-family: inherit;
        }

        .toast-close:hover {
            color: var(--text-primary);
        }

        .toast-close:focus-visible,
        .toast-details-toggle:focus-visible {
            outline: 2px solid var(--focus-border);
            outline-offset: 2px;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .toast.removing {
            animation: slideOut 0.3s ease forwards;
        }

        @keyframes slideOut {
            to {
                transform: translateX(400px);
                opacity: 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .upload-area,
            .progress-fill,
            .camera-details summary::before,
            .toast {
                transition: none;
                animation: none;
            }
        }

        /* Responsive: stack rows below ~800px */
        @media (max-width: 800px) {
            .container {
                padding: 0 1rem;
            }

            .preview-card {
                grid-template-columns: 1fr;
                gap: 0.75rem;
            }

            .preview-checkbox {
                position: absolute;
                top: 1rem;
                right: 1rem;
                margin-top: 0;
            }

            .preview-image-col {
                width: 100%;
            }

            .upload-area.is-compact {
                flex-wrap: wrap;
            }
        }
    </style>
{% endblock %}

{% block content %}
<!-- Toast Notification Container -->
    <div class="toast-container" id="toastContainer"></div>



    <div class="container">
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 16l4.586-4.586a2 2 0 0 1 2.828 0L16 16" />
                    <path d="M14 14l1.586-1.586a2 2 0 0 1 2.828 0L20 14" />
                    <rect x="3" y="5" width="18" height="14" rx="2" />
                    <circle cx="8" cy="9" r="1.5" />
                </svg>
            </div>
            <h2 id="uploadAreaTitle">Drag &amp; Drop Photos</h2>
            <p id="uploadAreaHint">or click to browse (JPG, PNG, up to 20MB each)</p>
            <button type="button" id="browseBtn" class="btn btn-primary">Browse Files</button>
            <input type="file" id="fileInput" accept="image/jpeg,image/png,image/jpg" multiple>
        </div>

        <div id="batchControls" class="batch-controls">
            <span class="batch-count"><span id="selectedCount">0</span> images selected</span>
            <button type="button" id="batchSelectAll" class="btn btn-secondary btn-small">Select all</button>
            <button type="button" id="batchDeselectAll" class="btn btn-secondary btn-small">Clear selection</button>
            <button type="button" id="batchDelete" class="btn btn-danger">Delete selected</button>
            <button type="button" id="batchSave" class="btn btn-secondary">Save selected</button>
            <button type="button" id="batchPublish" class="btn btn-primary">Publish selected</button>
        </div>

        <div id="previews" class="previews"></div>
    </div>

    <datalist id="categoryOptions"></datalist>
{% endblock %}

{% block scripts %}
    <script>
        // Get current user ID from page context
        const CURRENT_USER_ID = {{ current_user.id }};

        function csrfHeaders() {
            const meta = document.querySelector('meta[name="csrf-token"]');
            return meta ? { 'X-CSRF-Token': meta.getAttribute('content') } : {};
        }

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewsContainer = document.getElementById('previews');

        let uploadQueue = [];
        let activeUploads = 0;
        const MAX_CONCURRENT_UPLOADS = 3;

        // Toast Notification System
        function showToast(type, title, message, error = null) {
            const container = document.getElementById('toastContainer');
            const toastId = `toast-${Date.now()}`;

            const icons = {
                error: '❌',
                warning: '⚠️',
                success: '✅',
                info: 'ℹ️'
            };

            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.id = toastId;

            let detailsHtml = '';
            if (error) {
                const errorDetails = JSON.stringify(error, null, 2);
                detailsHtml = `
                    <div class="toast-details">
                        <button type="button" class="toast-details-toggle" data-toast-action="toggle" aria-expanded="false">
                            ▼ View Details
                        </button>
                        <div class="toast-details-content" id="${toastId}-details" style="display: none;">
                            ${escapeHtml(errorDetails)}
                        </div>
                    </div>
                `;
            }

            toast.innerHTML = `
                <div class="toast-icon">${icons[type]}</div>
                <div class="toast-content">
                    <div class="toast-title">${escapeHtml(title)}</div>
                    <div class="toast-message">${escapeHtml(message)}</div>
                    ${detailsHtml}
                </div>
                <button type="button" class="toast-close" data-toast-action="close" aria-label="Dismiss notification">&times;</button>
            `;

            container.appendChild(toast);

            // Auto-remove after duration
            const duration = type === 'error' ? 10000 : 5000;
            setTimeout(() => removeToast(toastId), duration);

            // Log to console for diagnosis
            if (error) {
                console.error(`[${type.toUpperCase()}] ${title}:`, message, error);
            } else {
                console.log(`[${type.toUpperCase()}] ${title}:`, message);
            }

            return toastId;
        }

        function removeToast(toastId) {
            const toast = document.getElementById(toastId);
            if (toast) {
                toast.classList.add('removing');
                setTimeout(() => toast.remove(), 300);
            }
        }

        function toggleToastDetails(toastId) {
            const details = document.getElementById(`${toastId}-details`);
            const toggle = document.querySelector(`#${toastId} .toast-details-toggle`);
            if (details && toggle) {
                if (details.style.display === 'none') {
                    details.style.display = 'block';
                    toggle.textContent = '▲ Hide Details';
                    toggle.setAttribute('aria-expanded', 'true');
                } else {
                    details.style.display = 'none';
                    toggle.textContent = '▼ View Details';
                    toggle.setAttribute('aria-expanded', 'false');
                }
            }
        }

        document.getElementById('toastContainer').addEventListener('click', (e) => {
            const btn = e.target.closest('[data-toast-action]');
            if (!btn) return;
            const toast = btn.closest('.toast');
            if (!toast) return;
            if (btn.dataset.toastAction === 'close') {
                removeToast(toast.id);
            } else if (btn.dataset.toastAction === 'toggle') {
                toggleToastDetails(toast.id);
            }
        });

        // Populate the category <datalist> from the photographer's existing
        // published images, so category entry can pick a known value instead
        // of silently forking a new one via a typo. Free text is still
        // allowed (it's an <input>, not a <select>). Fails silently.
        async function loadCategoryOptions() {
            try {
                const response = await fetch(`/api/gallery/published?user_id=${CURRENT_USER_ID}`, { credentials: 'include' });
                if (!response.ok) return;
                const data = await response.json();
                const images = Array.isArray(data.images) ? data.images : [];
                const categories = new Set(images.map(img => img.category).filter(Boolean));
                const datalist = document.getElementById('categoryOptions');
                if (!datalist) return;
                datalist.innerHTML = Array.from(categories)
                    .map(cat => `<option value="${escapeHtml(cat)}"></option>`)
                    .join('');
            } catch (error) {
                // Non-critical: category autocomplete just won't be populated.
            }
        }
        loadCategoryOptions();

        // Drag and drop handlers
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
            handleFiles(files);
        });

        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            handleFiles(files);
            fileInput.value = '';
        });

        document.getElementById('browseBtn').addEventListener('click', () => fileInput.click());
        document.getElementById('batchSelectAll').addEventListener('click', selectAll);
        document.getElementById('batchDeselectAll').addEventListener('click', deselectAll);
        document.getElementById('batchDelete').addEventListener('click', batchDelete);
        document.getElementById('batchSave').addEventListener('click', batchSaveDraft);
        document.getElementById('batchPublish').addEventListener('click', batchPublish);

        previewsContainer.addEventListener('click', (e) => {
            const btn = e.target.closest('[data-action]');
            if (!btn) return;
            const fileId = parseInt(btn.dataset.fileId);
            const imageId = parseInt(btn.dataset.imageId);
            const handlers = { save: saveMetadata, publish: publishImage, delete: deleteImage, reextract: reextractEXIF, regenerate: regenerateAI };
            handlers[btn.dataset.action]?.(fileId, imageId);
        });

        function handleFiles(files) {
            files.forEach(file => {
                if (file.size > 20 * 1024 * 1024) {
                    showToast('error', 'File Too Large', `${file.name} exceeds the 20MB maximum file size.`);
                    return;
                }

                const fileId = Date.now() + Math.floor(Math.random() * 10000);
                const fileData = {
                    id: fileId,
                    file: file,
                    status: 'queued',
                    metadata: {}
                };

                uploadQueue.push(fileData);
                createPreviewCard(fileData);
            });

            // Start processing queue
            processUploadQueue();
        }

        function processUploadQueue() {
            // Process uploads concurrently up to MAX_CONCURRENT_UPLOADS
            while (activeUploads < MAX_CONCURRENT_UPLOADS && uploadQueue.length > 0) {
                const queuedItems = uploadQueue.filter(item => item.status === 'queued');
                if (queuedItems.length === 0) break;

                const fileData = queuedItems[0];
                fileData.status = 'uploading';
                activeUploads++;

                uploadFile(fileData)
                    .then(() => {
                        activeUploads--;
                        processUploadQueue(); // Process next item
                    })
                    .catch(() => {
                        activeUploads--;
                        processUploadQueue(); // Process next item even on error
                    });
            }
        }

        // Collapses the drop zone into a slim bar once at least one preview
        // exists, and restores it (with original copy) when none remain.
        // Exported under this name so the screenshot harness can call it
        // after injecting fake previews directly.
        function onPreviewsChanged() {
            const hasPreviews = previewsContainer.children.length > 0;
            uploadArea.classList.toggle('is-compact', hasPreviews);
            document.getElementById('uploadAreaTitle').textContent = hasPreviews ? 'Add more photos' : 'Drag & Drop Photos';
            document.getElementById('uploadAreaHint').textContent = hasPreviews
                ? 'or drag and drop'
                : 'or click to browse (JPG, PNG, up to 20MB each)';
        }

        function createPreviewCard(fileData) {
            const card = document.createElement('div');
            card.className = 'preview-card';
            card.id = `preview-${fileData.id}`;

            // Add checkbox
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = 'preview-checkbox';
            checkbox.id = `checkbox-${fileData.id}`;
            checkbox.dataset.fileId = fileData.id;
            checkbox.setAttribute('aria-label', 'Select ' + fileData.file.name + ' for batch actions');
            checkbox.addEventListener('change', updateBatchControls);

            const imageCol = document.createElement('div');
            imageCol.className = 'preview-image-col';

            const img = document.createElement('img');
            img.className = 'preview-image';
            img.alt = '';

            const reader = new FileReader();
            reader.onload = (e) => {
                img.src = e.target.result;
            };
            reader.readAsDataURL(fileData.file);

            const sizeInMB = (fileData.file.size / 1024 / 1024).toFixed(2);

            // Build the text below the image as its own node instead of
            // concatenating onto imageCol.innerHTML: mutating innerHTML after
            // appendChild(img) would re-parse and detach `img`, so the src
            // the FileReader sets later (asynchronously) would land on a
            // node no longer in the document.
            const imageMeta = document.createElement('div');
            imageMeta.innerHTML = `
                <div class="preview-filename">${escapeHtml(fileData.file.name)}</div>
                <div class="preview-size">${sizeInMB} MB</div>
                <div class="preview-status status-pending">Queued...</div>
            `;

            imageCol.appendChild(img);
            while (imageMeta.firstChild) {
                imageCol.appendChild(imageMeta.firstChild);
            }

            const content = document.createElement('div');
            content.className = 'preview-content';
            content.innerHTML = `
                <div class="progress-bar">
                    <div class="progress-fill uploading" id="progress-${fileData.id}"></div>
                </div>
                <div class="progress-stage" id="stage-${fileData.id}">Waiting in queue...</div>
                <div id="metadata-${fileData.id}"></div>
                <div id="actions-${fileData.id}"></div>
            `;

            card.appendChild(checkbox);
            card.appendChild(imageCol);
            card.appendChild(content);
            previewsContainer.appendChild(card);
            onPreviewsChanged();
        }

        function uploadFile(fileData) {
            return new Promise((resolve, reject) => {
                const formData = new FormData();
                formData.append('file', fileData.file);

                const xhr = new XMLHttpRequest();

                // Track upload progress (file transfer)
                xhr.upload.addEventListener('progress', (e) => {
                    if (e.lengthComputable) {
                        // Upload is 0-50% of total progress
                        const uploadPercent = Math.round((e.loaded / e.total) * 50);
                        updateProgress(fileData.id, uploadPercent);
                        updateStage(fileData.id, 'uploading', 'Uploading...');
                        updateStatus(fileData.id, 'processing', `Uploading... ${uploadPercent}%`);
                    }
                });

                // Upload completed, now server is processing
                xhr.upload.addEventListener('load', () => {
                    updateProgress(fileData.id, 50);
                    updateStage(fileData.id, 'processing', 'Analyzing image...');
                    updateStatus(fileData.id, 'processing', 'Analyzing image...');
                });

                // Handle response
                xhr.addEventListener('load', () => {
                    try {
                        const result = JSON.parse(xhr.responseText);

                        if (xhr.status !== 200 || result.success === false) {
                            if (result.error) {
                                const error = result.error;
                                showToast(
                                    'error',
                                    error.code || 'Upload Failed',
                                    error.user_message || error.message || 'An error occurred during upload',
                                    error
                                );
                                updateStatus(fileData.id, 'error', error.user_message || 'Upload failed');
                                updateProgress(fileData.id, 0);
                                updateStage(fileData.id, 'error', 'Failed');
                                reject(new Error(error.message));
                                return;
                            } else {
                                throw new Error(`Upload failed: ${xhr.statusText}`);
                            }
                        }

                        // Complete
                        updateProgress(fileData.id, 100);
                        updateStage(fileData.id, 'complete', 'Complete ✓');

                        fileData.metadata = result;
                        fileData.imageId = result.image_id;

                        if (result.warnings && result.warnings.length > 0) {
                            result.warnings.forEach(warning => {
                                showToast(
                                    'warning',
                                    warning.code || 'Warning',
                                    warning.user_message || warning.message || 'A warning occurred',
                                    warning
                                );
                            });
                        }

                        showToast('success', 'Upload Complete', `${fileData.file.name} was processed successfully`);

                        updateStatus(fileData.id, 'success', 'Processing complete ✓');
                        displayMetadata(fileData.id, result);
                        displayActions(fileData.id, result.image_id);

                        resolve(result);

                    } catch (error) {
                        console.error('Upload error:', error);
                        showToast('error', 'Upload Failed', `${fileData.file.name}: ${error.message}`, {error: error.toString()});
                        updateStatus(fileData.id, 'error', `Error: ${error.message}`);
                        updateProgress(fileData.id, 0);
                        updateStage(fileData.id, 'error', 'Failed');
                        reject(error);
                    }
                });

                // Handle network errors
                xhr.addEventListener('error', () => {
                    const error = new Error('Network error during upload');
                    console.error('Upload error:', error);
                    showToast('error', 'Upload Failed', `${fileData.file.name}: Network error`, {error: error.toString()});
                    updateStatus(fileData.id, 'error', 'Network error');
                    updateProgress(fileData.id, 0);
                    updateStage(fileData.id, 'error', 'Failed');
                    reject(error);
                });

                // Handle abort
                xhr.addEventListener('abort', () => {
                    const error = new Error('Upload cancelled');
                    updateStatus(fileData.id, 'error', 'Cancelled');
                    updateProgress(fileData.id, 0);
                    updateStage(fileData.id, 'error', 'Cancelled');
                    reject(error);
                });

                // Start upload
                xhr.open('POST', '/api/images/ingest');
                xhr.withCredentials = true;
                const csrfMeta = document.querySelector('meta[name="csrf-token"]');
                if (csrfMeta) xhr.setRequestHeader('X-CSRF-Token', csrfMeta.getAttribute('content'));
                xhr.send(formData);
            });
        }

        function updateStatus(fileId, status, text) {
            const statusEl = document.querySelector(`#preview-${fileId} .preview-status`);
            if (statusEl) {
                statusEl.className = `preview-status status-${status}`;
                statusEl.textContent = text;
            }
            // Reduce redundant chrome: once successfully complete, collapse
            // the progress bar/stage text and keep only the status pill.
            // Errors stay fully visible so the photographer can diagnose them.
            const card = document.getElementById(`preview-${fileId}`);
            if (card) {
                card.classList.toggle('is-done', status === 'success');
            }
        }

        function updateStage(fileId, stage, text) {
            const progressEl = document.getElementById(`progress-${fileId}`);

        // Builds the one-line camera summary shown in the collapsed
        // <details> element, e.g.
        // "Google Pixel 8 Pro · 6.9mm · f/1.85 · 1/1250s · ISO 42 · 12 Jul 2026 · GPS set"
        // GPS presence is called out explicitly since it's a privacy concern.
        function buildExifSummary(exif) {
            if (!exif) return 'No camera data';
            const parts = [];
            if (exif.camera) parts.push(exif.camera);
            if (exif.focal_length) parts.push(exif.focal_length);
            if (exif.aperture) parts.push(exif.aperture);
            if (exif.shutter_speed) parts.push(exif.shutter_speed);
            if (exif.iso) parts.push(`ISO ${exif.iso}`);
            if (exif.date_taken) {
                const parsed = new Date(exif.date_taken.replace(' ', 'T'));
                if (!isNaN(parsed)) {
                    parts.push(parsed.toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' }));
                } else {
                    parts.push(exif.date_taken);
                }
            }
            if (exif.location) parts.push('GPS set');
            return parts.length > 0 ? parts.map(escapeHtml).join(' &middot; ') : 'No camera data';
        }

        function calculatePrintSizes(width, height) {
            if (!width || !height) return [];

            const DPI_HIGH = 300;  // High quality prints
            const DPI_STANDARD = 200; // Standard quality

            // Calculate max dimensions at different DPIs
            const inchesHighW = width / DPI_HIGH;
            const inchesHighH = height / DPI_HIGH;
            const inchesStdW = width / DPI_STANDARD;
            const inchesStdH = height / DPI_STANDARD;

            // Common print sizes (width x height in inches)
            const standardSizes = [
                { w: 4, h: 6, name: '4×6"' },
                { w: 5, h: 7, name: '5×7"' },
                { w: 8, h: 10, name: '8×10"' },
                { w: 11, h: 14, name: '11×14"' },
                { w: 16, h: 20, name: '16×20"' },
                { w: 20, h: 24, name: '20×24"' },
                { w: 24, h: 36, name: '24×36"' },
                { w: 30, h: 40, name: '30×40"' }
            ];

            const recommended = [];
            const aspectRatio = width / height;

            for (const size of standardSizes) {
                const sizeRatio = size.w / size.h;
                const ratioMatch = Math.abs(sizeRatio - aspectRatio) < 0.15; // Within 15% aspect ratio match

                if (ratioMatch) {
                    if (size.w <= inchesHighW && size.h <= inchesHighH) {
                        recommended.push(`${size.name} Excellent`);
                    } else if (size.w <= inchesStdW && size.h <= inchesStdH) {
                        recommended.push(`${size.name} Good`);
                    }
                }
            }

            // If no standard sizes fit, show maximum at 300 DPI
            if (recommended.length === 0) {
                recommended.push(`Up to ${Math.floor(inchesHighW)}×${Math.floor(inchesHighH)}" at 300 DPI`);
            }

            return recommended.slice(0, 6); // Limit to 6 sizes
        }

        function displayActions(fileId, imageId) {
            const container = document.getElementById(`actions-${fileId}`);

            container.innerHTML = `

                        <button type="button" class="btn btn-danger btn-small" data-action="delete" data-file-id="${fileId}" data-image-id="${imageId}">Delete</button>
                    </div>
                    <div class="actions-right">
                        <button type="button" class="btn btn-secondary btn-small" data-action="save" data-file-id="${fileId}" data-image-id="${imageId}">Save draft</button>
                        <button type="button" class="btn btn-primary btn-small" data-action="publish" data-file-id="${fileId}" data-image-id="${imageId}">Publish</button>
                    </div>

        async function saveMetadata(fileId, imageId) {
            const metadata = {
                title: document.getElementById(`title-${fileId}`).value,
                caption: document.getElementById(`caption-${fileId}`).value,
                tags: document.getElementById(`tags-${fileId}`).value,
                category: document.getElementById(`category-${fileId}`).value,
                // Technical metadata (now editable)
                aperture: document.getElementById(`aperture-${fileId}`)?.value || null,
                shutter_speed: document.getElementById(`shutter_speed-${fileId}`)?.value || null,
                iso: document.getElementById(`iso-${fileId}`)?.value || null,
                camera: document.getElementById(`camera-${fileId}`)?.value || null,
                lens: document.getElementById(`lens-${fileId}`)?.value || null,
                focal_length: document.getElementById(`focal_length-${fileId}`)?.value || null,
                location: document.getElementById(`location-${fileId}`)?.value || null,
                date_taken: document.getElementById(`date_taken-${fileId}`)?.value || null
            };

            try {
                const response = await fetch(`/api/images/${imageId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json', ...csrfHeaders() },
                    credentials: 'include',
                    body: JSON.stringify(metadata)
                });

                if (response.ok) {
                    showToast('success', 'Saved', 'Metadata saved successfully');
                    return true;
                }

                // Surface the API's validation details (e.g. which field was
                // rejected and why) instead of a generic failure message.
                let message = 'Failed to save metadata';
                try {
                    const errorData = await response.json();
                    if (Array.isArray(errorData.detail)) {
                        message = errorData.detail
                            .map(err => `${err.loc[err.loc.length - 1]}: ${err.msg}`)
                            .join('; ');
                    } else if (errorData.detail) {
                        message = errorData.detail;
                    }
                } catch (parseError) {
                    // Non-JSON error body; keep the generic message.
                }
                showToast('error', 'Save Failed', message);
                return false;
            } catch (error) {
                console.error('Save error:', error);
                showToast('error', 'Save Failed', 'Error saving metadata');
                return false;
            }
        }

        async function publishImage(fileId, imageId) {
            // Do not publish over a failed save: the toast from saveMetadata
            // already explains what was rejected.
            const saved = await saveMetadata(fileId, imageId);
            if (!saved) return false;

            try {
                const response = await fetch(`/api/images/${imageId}/publish`, {
                    method: 'POST',
                    headers: csrfHeaders(),
                    credentials: 'include'
                });

                if (response.ok) {
                    showToast('success', 'Published', 'Image published successfully');
                    updateStatus(fileId, 'success', 'Published ✓');
                    return true;
                }
                showToast('error', 'Publish Failed', 'Failed to publish image');
                return false;
            } catch (error) {
                console.error('Publish error:', error);
                showToast('error', 'Publish Failed', 'Error publishing image');
                return false;
            }
        }

        async function deleteImage(fileId, imageId) {
            if (!confirm('Are you sure you want to delete this image?')) return;

            try {
                const response = await fetch(`/api/images/${imageId}`, {
                    method: 'DELETE',
                    headers: csrfHeaders(),
                    credentials: 'include'
                });

                if (response.ok) {
                    const card = document.getElementById(`preview-${fileId}`);
                    if (card) card.remove();
                    onPreviewsChanged();
                    showToast('success', 'Deleted', 'Image deleted successfully');
                } else {
                    showToast('error', 'Delete Failed', 'Failed to delete image');
                }
            } catch (error) {
                console.error('Delete error:', error);
                showToast('error', 'Delete Failed', 'Error deleting image');
            }
        }

        // Escapes quotes too: values are interpolated into HTML attributes,
        // where the textContent/innerHTML trick is not sufficient.
        function escapeHtml(text) {
            return String(text ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // Batch operation functions
        function updateBatchControls() {
            const checkboxes = document.querySelectorAll('.preview-checkbox');
            const checkedBoxes = Array.from(checkboxes).filter(cb => cb.checked);
            const count = checkedBoxes.length;

            document.getElementById('selectedCount').textContent = count;
            const batchControls = document.getElementById('batchControls');

            if (count > 0) {
                batchControls.classList.add('visible');
            } else {
                batchControls.classList.remove('visible');
            }
        }

        function selectAll() {
            document.querySelectorAll('.preview-checkbox').forEach(cb => {
                cb.checked = true;
            });
            updateBatchControls();
        }

        function deselectAll() {
            document.querySelectorAll('.preview-checkbox').forEach(cb => {
                cb.checked = false;
            });
            updateBatchControls();
        }

        function getSelectedImageIds() {
            const checkboxes = document.querySelectorAll('.preview-checkbox:checked');
            return Array.from(checkboxes).map(cb => {
                const fileId = parseInt(cb.dataset.fileId);
                const fileData = uploadQueue.find(f => f.id === fileId);
                return fileData ? fileData.imageId : null;
            }).filter(id => id != null);
        }

        async function batchSaveDraft() {
            const checkboxes = document.querySelectorAll('.preview-checkbox:checked');
            const fileIds = Array.from(checkboxes).map(cb => parseInt(cb.dataset.fileId));

            if (fileIds.length === 0) {
                showToast('warning', 'No Selection', 'Please select images to save');
                return;
            }

            let success = 0;
            let failed = 0;

            for (const fileId of fileIds) {
                const fileData = uploadQueue.find(f => f.id === fileId);
                if (fileData && fileData.imageId) {
                    // saveMetadata reports failures via its return value, not
                    // by throwing, so count on the result.
                    const saved = await saveMetadata(fileId, fileData.imageId);
                    if (saved) success++; else failed++;
                }
            }

            showToast(failed > 0 ? 'warning' : 'success', 'Batch Save Complete', `${success} images saved, ${failed} failed`);
        }

        async function batchPublish() {
            const checkboxes = document.querySelectorAll('.preview-checkbox:checked');
            const fileIds = Array.from(checkboxes).map(cb => parseInt(cb.dataset.fileId));

            if (fileIds.length === 0) {
                showToast('warning', 'No Selection', 'Please select images to publish');
                return;
            }

            let success = 0;
            let failed = 0;

            for (const fileId of fileIds) {
                const fileData = uploadQueue.find(f => f.id === fileId);
                if (fileData && fileData.imageId) {
                    const published = await publishImage(fileId, fileData.imageId);
                    if (published) success++; else failed++;
                }
            }

            showToast(failed > 0 ? 'warning' : 'success', 'Batch Publish Complete', `${success} images published, ${failed} failed`);
        }

        async function batchDelete() {
            const checkboxes = document.querySelectorAll('.preview-checkbox:checked');
            const fileIds = Array.from(checkboxes).map(cb => parseInt(cb.dataset.fileId));

            if (fileIds.length === 0) {
                showToast('warning', 'No Selection', 'Please select images to delete');
                return;
            }

            if (!confirm(`Are you sure you want to delete ${fileIds.length} images?`)) {
                return;
            }

            let success = 0;
            let failed = 0;

            for (const fileId of fileIds) {
                const fileData = uploadQueue.find(f => f.id === fileId);
                if (fileData && fileData.imageId) {
                    try {
                        await deleteImage(fileId, fileData.imageId);
                        success++;
                    } catch (e) {
                        failed++;
                    }
                }
            }

            showToast('success', 'Batch Delete Complete', `${success} images deleted, ${failed} failed`);
            updateBatchControls();
        }

        // Re-Extract EXIF from original file
        async function reextractEXIF(fileId, imageId) {
            if (!confirm('Re-extract EXIF data from the original file? This will overwrite current EXIF fields.')) {
                return;
            }

            try {
                const response = await fetch(`/api/images/${imageId}/reextract-exif`, {
                    method: 'POST',
                    headers: csrfHeaders(),
                    credentials: 'include'
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    showToast('success', 'EXIF Re-Extracted', 'EXIF data refreshed from original file');

                    // Update UI fields with new EXIF data
                    if (result.exif) {
                        const exif = result.exif;
                        if (exif.aperture) document.getElementById(`aperture-${fileId}`).value = exif.aperture;
                        if (exif.shutter_speed) document.getElementById(`shutter_speed-${fileId}`).value = exif.shutter_speed;
                        if (exif.iso) document.getElementById(`iso-${fileId}`).value = exif.iso;
                        if (exif.camera) document.getElementById(`camera-${fileId}`).value = exif.camera;
                        if (exif.lens) document.getElementById(`lens-${fileId}`).value = exif.lens;
                        if (exif.focal_length) document.getElementById(`focal_length-${fileId}`).value = exif.focal_length;
                        if (exif.location) document.getElementById(`location-${fileId}`).value = exif.location;
                        if (exif.date_taken) document.getElementById(`date_taken-${fileId}`).value = exif.date_taken;

                        // Keep the collapsed summary in sync with the refreshed EXIF.
                        const summaryEl = document.querySelector(`#metadata-${fileId} .camera-details summary`);
                        if (summaryEl) summaryEl.innerHTML = buildExifSummary(exif);
                    }
                } else {
                    showToast('error', 'EXIF Extraction Failed', result.error?.user_message || 'Failed to extract EXIF');
                }
            } catch (error) {
                console.error('EXIF extraction error:', error);
                showToast('error', 'EXIF Extraction Failed', 'Network error');
            }
        }

        // Regenerate metadata (title, caption, tags, category)
        async function regenerateAI(fileId, imageId) {
            if (!confirm('Regenerate the title, caption, tags, and category for this image? Current values will be overwritten.')) {
                return;
            }

            try {
                const formData = new FormData();

                const response = await fetch(`/api/images/${imageId}/regenerate-ai`, {
                    method: 'POST',
                    headers: csrfHeaders(),
                    credentials: 'include',
                    body: formData
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    showToast('success', 'Metadata Regenerated', 'Title, caption, tags, and category were updated.');

                    // Update UI fields with new metadata
                    if (result.title) document.getElementById(`title-${fileId}`).value = result.title;
                    if (result.caption) document.getElementById(`caption-${fileId}`).value = result.caption;
                    if (result.tags) document.getElementById(`tags-${fileId}`).value = result.tags;
                    if (result.category) document.getElementById(`category-${fileId}`).value = result.category;
                } else {
                    showToast('error', 'Regeneration Failed', result.error?.user_message || 'Failed to regenerate metadata');
                }
            } catch (error) {
                console.error('Metadata regeneration error:', error);
                showToast('error', 'Regeneration Failed', 'Network error');
            }
        }

    </script>
{% endblock %}
