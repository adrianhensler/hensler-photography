name: Local photo browser
on:
  pull_request:
    paths:
      - 'prototypes/local-photo-browser/**'
      - '.github/workflows/local-photo-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prototype:
    # Match the OS supported by the repository-locked Playwright version.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install -r prototypes/local-photo-browser/requirements.txt
      - run: python -m unittest discover -s tests -v
        working-directory: prototypes/local-photo-browser
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node prototypes/local-photo-browser/tests/ui-smoke.cjs
